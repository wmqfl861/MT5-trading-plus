# 换日与禁入窗（T20，2026-10-26；决策 D10/D11）——回测引擎与实盘风控共用的
# 唯一定义源（铁律 v3 第 11 条）。禁入规则只保留这一处：risk.toml 不再有时段。
#
# 换日时刻按交易所本地墙上时间定义（铁律第 1 条，禁止固定 UTC 小时）：
# Exness 换日/隔夜费计费时刻 = 17:00 America/New_York =
# 夏令时 21:00 GMT、冬令时 22:00 GMT（冬夏由 zoneinfo 自动切换）。

version = 1

[rollover]
local_time = "17:00"
tz = "America/New_York"

[forbidden]
# 禁入窗 = 换日时刻前 5 分钟到后 60 分钟（本地墙上时间）。
pre_minutes = 5
post_minutes = 60
# 加密货币 7×24 交易、无换日结算：豁免换日禁入窗（隔夜费三倍日仍按品种规则计）。
exempt_symbols = ["BTCUSD"]

# 扩展禁入窗（可选）：指定品种把禁入窗的**结束**时刻延长到该本地时刻
# （[forbidden.extended.<品种>] end_local = "HH:MM"）。
# T35（2026-10-26）起两条硬约束：
# 1. 长度上限 3 小时（换日时刻 → end_local），超过须显式写
#    allow_long_window = true 并附理由注释（SessionPolicy 拒绝加载超限配置）；
# 2. 禁止跨越亚洲时段的窗口。
# EURUSD 的 23:00 初值已删除：按纽约本地小时用 2026-10 tick 重测，工作日
# 点差在 18:00 NY（基础窗终点）已完全恢复（p50/p90 = 日内水平），残余 p99
# 尖峰全部来自周日开盘后的薄流动性（10-11/10-18 两个周日 17:05 开盘、
# 18 点档抬升），由点差闸门（3×该小时 p90）与小时分桶成本模型覆盖——
# 数据见 docs/research/rollover-dst-2026-10-25.md 第 3 节。

[costs]
# 点差闸门（T24 实盘开仓前使用）：当前点差 > 倍数 × 模型该小时 p90 → 跳过开仓。
spread_gate_multiplier = 3.0
# 点差模型某纽约本地小时缺统计时的策略：forbid = 该小时禁入、出场成本取全天最大 p90。
missing_hour_policy = "forbid"
# T36（H2）：点差模型某纽约本地小时的最少覆盖天数（n_days）——不足即视为缺统计
# （forbid 语义：禁入该小时、出场成本取足额小时的最大 p90）。bar_open_m1 采样
# （每 M1 边界后第一笔 tick）下每小时每天至多 60 个样本，覆盖天数才是样本量
# 的关键维度；20 天 ≈ 一个月工作日的覆盖下限。
min_days_per_hour = 20
