# 关卡 v3 提案（T65/D34，蓝图 v4 附录 B"关卡 v3 提案框架"）——**不生效**：
# 加载器只在显式 suite="v3" 时读本文件（gates.load_gates(suite="v3")）；
# 缺省加载路径与冻结对象仍是 config/gates.toml（FROZEN_GATES_SHA256）。
# 本文件有自己的冻结指纹 FROZEN_GATES_V3_SHA256（同机制防悄悄改动）。
#
# 批准后的替换步骤（一次提交内完成）：
# 1. 本文件内容替换 config/gates.toml；
# 2. 同一提交更新 gates.py 的 FROZEN_GATES_SHA256（与 FROZEN_V3 合一）；
# 3. 蓝图追加 D34 决策记录。
version = 3

[v3]                                    # v3 新增节（蓝图附录 B 提案框架）
# 主检验（否决）——两个备选都已实现与标定，primary_test 指定生效方案：
# "dsr"        方案甲：walk-forward 拼接样本外收益的 PSR/DSR
#              （N 与试验夏普按 [g4].dsr_trial_scope 取数，v3 = project）；
# "year_block" 方案乙：同一 OOS 收益序列按年块自助的单侧 p 值
#              （Bonferroni 按同一项目级 N；事件模式传 event_returns
#               DataFrame——同一实现，T66 已单独标定，不重标）。
primary_test = "dsr"
alpha = 0.05                            # 方案乙名义单侧显著性（Bonferroni 前）
bootstrap_sims = 1000                   # 方案乙年块自助次数（事件模式同值）
# 稳健性否决（蓝图附录 B：三项，全部否决）
cost_scale_veto = 1.5                   # 成本 ×1.5 期望（每笔净利均值）仍 > 0
delay_bars = 1                          # 信号延迟一根 bar 执行净利仍 > 0
buyhold_excess_veto = true              # 纯多头策略夏普须高于同期买入持有
                                        # （非纯多头不适用，不否决）

[g1]                                   # 样本内线（v3：诊断层，只报告）
trade_count_min_intraday = 300
trade_count_min_hourly = 150
gross_cost_multiple_min = 3.0
profit_factor_min = 1.2

[g2]                                   # 阈值复用：诊断层（参数邻域/按年分段/
                                       # 去最好 5%）与 v3 否决的缺省参照
cost_scale_pass = 1.5
cost_scale_record = 2.0
plateau_min_fraction = 0.70
yearly_min_fraction = 0.70
yearly_max_concentration = 0.50
random_entry_percentile = 95.0
random_entry_sims = 200
drop_best_fraction = 0.05
cross_symbol_min = 2

[g3]                                   # walk-forward 窗口（v3：主检验的数据源）
train_months_hourly = 24
test_months_hourly = 6
train_months_intraday = 12
test_months_intraday = 3
min_oos_ratio = 0.50                   # 诊断层：OOS/IS 夏普比（只报告）

[g4]                                   # 主检验甲的显著性与 N 取数范围
dsr_min_probability = 0.95
dsr_trial_scope = "project"            # v3：N 按项目级（蓝图附录 B；现行
                                       # gates.toml 无此键 → family 冻结不变）
mc_drawdown_sims = 1000                # 回撤分位：诊断层（只报告）
mc_drawdown_percentile_max = 99.0

[g5]                                   # 锁箱一次性（v3：不变，否决）
lockbox_sharpe_min_percentile = 5.0
lockbox_warn_percentile = 95.0
lockbox_min_trades_ratio = 0.50
lockbox_bootstrap_sims = 2000
