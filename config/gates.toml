# 关卡门槛 v3（T65 提案 + T85 工作点补充标定，D34 冻结 2026-10-29——
# 第十四轮审核 §2 批准：方案甲 DSR(N, V₀)，四项冻结条件同一提交落地）。
# 冻结机制：本文件的 sha256 记录在 src/mt5quant/validation/gates.py 的
# FROZEN_GATES_SHA256；load_gates 每次加载先核对，不符 → 拒绝运行
# （防偷偷放松门槛）。
# 冻结历史：
# - 2026-10-24（T12 初值，v1）；2026-10-25 P5 校准后维持；
# - 2026-10-26（T21 第二次冻结，v2，指纹 68f49237…）：[g3] 窗口改日历月
#   （H5）、[g5] 改单侧判定（C3）；
# - 2026-10-29（T85/D34 第三次冻结，v3）：本文件（T65 提案 + T85 增补
#   [v3.event]）按提案 §8 替换 config/gates.toml，v2/v3 双轨收束
#   （load_gates 缺省即 v3 语义）；同提交按 R14 §2 四项冻结条件改：
#   [v3] primary_test="dsr_v0"（L1，方案甲 V₀ 工作点）+ n_min=2（L2），
#   [g4] dsr_trial_scope="rounds_lineage"（L1，N=ledger.primary_test_n
#   的门槛部分）。[g1]–[g5] 数值沿用 v2 冻结值，语义按附录 B 分层。
version = 3

[v3]                                    # v3 主检验与稳健性否决（蓝图附录 B）
# 主检验（否决）——primary_test 指定生效方案（冻结 = dsr_v0）：
# "dsr_v0"    方案甲（T85 选定、R14 批准冻结）：DSR(N, V₀) ≥ 0.95，
#              V₀ = 1/(n−1) 为零假设下每根 bar 夏普估计的抽样方差
#              （n = 样本外 bar 数）；N 取 rounds_lineage 口径（[g4]），
#              N_eff = max(N, [v3].n_min)；台账试验夏普的经验方差只进
#              诊断，不进主检验；
# "dsr"       方案甲对照锚点：walk-forward 拼接样本外收益的 PSR/DSR，
#              试验夏普由调用方传入（标定臂 n_trials=1 退化为 PSR(0)——
#              现行 primary.dsr 键语义的对照锚点，不作生产主检验）；
# "year_block" 方案乙：同一 OOS 收益序列按年块自助的单侧 p 值
#              （Bonferroni 按同一 N；事件模式传 event_returns
#               DataFrame——同一实现，T66 已单独标定，不重标）。
primary_test = "dsr_v0"
n_min = 2                                # L2（R14 §2）：主检验 N 下限——
                                         # N_eff = max(N, n_min)；N=1 不在
                                         # 标定网格且 PSR 家族该点误报偏高
                                         # （T85 §4.3）。事件模式分支不受
                                         # 影响（随机化检验 N=1 也精确）
alpha = 0.05                            # 方案乙名义单侧显著性（Bonferroni 前）
bootstrap_sims = 1000                   # 方案乙年块自助次数（事件模式同值）
# 稳健性否决（蓝图附录 B：三项，全部否决）
cost_scale_veto = 1.5                   # 成本 ×1.5 期望（每笔净利均值）仍 > 0
delay_bars = 1                          # 信号延迟一根 bar 执行净利仍 > 0
buyhold_excess_veto = true              # 纯多头策略夏普须高于同期买入持有
                                        # （非纯多头不适用，不否决）

[v3.event]                              # 事件模式分支（D35 修改三条，T85 写入；
                                        # T86 接线生效）。评估单位=事件窗，alpha
                                        # 与成本 ×1.5 复用 [v3] 节同一值（不设第
                                        # 二来源）。bar 级的"延迟一根"与"纯多头
                                        # 相对买入持有超额"两项否决对按时钟定义
                                        # 的事件窗不适用（第十三轮 K2：延迟一根
                                        # 落到定盘后反转段、真实月末效应的夏普通
                                        # 常低于全程持有——两项都会误杀）。
primary_test = "randomization"          # 主检验：随机化参照（对资产漂移稳健、
                                        # 误报率不依赖年块数——D35 修改 1），
                                        # 单侧 p ≤ alpha/N（N 口径同 [v3] 主检验：
                                        # project_n_dedup_rounds + lineage，
                                        # 不吃 n_min——随机化检验 N=1 也精确）
draws_min_base = 1999                   # 随机化次数下限基数项；总下限 =
                                        # max(1999, ⌈20N/alpha⌉)
draws_per_test_coeff = 20.0             # 下限公式的 N/alpha 系数——保证 p 值
                                        # 分辨率足以判到 alpha/N
delay_bars_veto = false                 # D35 修改 2：事件模式不适用"延迟一根"
buyhold_excess_veto = false             # D35 修改 2：事件模式不适用"买入持有超额"
diagnostics = [                         # D35 修改 3：诊断四项（只报告，不否决）
  "year_block_vs_zero",                 # 年块自助对 0 的检验
  "window_shift_1_bar",                 # 事件窗前后各移一根 bar 的结果
  "segmented_means",                    # 按 10 年或文献制度变化点分段均值
  "known_gaps",                         # 已知缺口的注记
]

[g1]                                   # 样本内线（v3：诊断层，只报告）
trade_count_min_intraday = 300
trade_count_min_hourly = 150
gross_cost_multiple_min = 3.0
profit_factor_min = 1.2

[g2]                                   # 阈值复用：诊断层（参数邻域/按年分段/
                                       # 去最好 5%）与 v3 否决的缺省参照
cost_scale_pass = 1.5
cost_scale_record = 2.0
plateau_min_fraction = 0.70
yearly_min_fraction = 0.70
yearly_max_concentration = 0.50
random_entry_percentile = 95.0
random_entry_sims = 200
drop_best_fraction = 0.05
cross_symbol_min = 2

[g3]                                   # walk-forward 窗口（v3：主检验的数据源）
train_months_hourly = 24
test_months_hourly = 6
train_months_intraday = 12
test_months_intraday = 3
min_oos_ratio = 0.50                   # 诊断层：OOS/IS 夏普比（只报告）

[g4]                                   # 主检验甲的显著性与 N 取数范围
dsr_min_probability = 0.95
dsr_trial_scope = "rounds_lineage"     # L1（R14 §2）：N = ledger.
                                       # primary_test_n(continues_family)
                                       # 的门槛部分 = project_n_dedup_rounds
                                       # + lineage_n_dedup（轮次外其余历史
                                       # 只报告不进门槛）；台账试验夏普的
                                       # 经验方差只进诊断
mc_drawdown_sims = 1000                # 回撤分位：诊断层（只报告）
mc_drawdown_percentile_max = 99.0

[g5]                                   # 锁箱一次性（v3：不变，否决）
lockbox_sharpe_min_percentile = 5.0
lockbox_warn_percentile = 95.0
lockbox_min_trades_ratio = 0.50
lockbox_bootstrap_sims = 2000
