# 阶段 F Demo 模式（MT5 模拟盘）示例配置（T49/R8-I4，2026-10-27）：
# SMA 快慢线交叉，XAUUSD M15，固定 0.01 手。
#
# 与 PaperSoak 示例（MA-XAUUSD-M15.toml，risk_fraction=0.005 影子盘）不同：
# 这是蓝图 §5 F 行的正式口径——真实 demo 账户成交路径（运行器不带
# --paper，下单经 MT5 网关，网关保险丝只放行 trade_mode=DEMO 账户），
# **固定 volume_lots=0.01**（演练手数上限；不用 risk_fraction——demo_run.ps1
# -Mode Demo 对此强制校验，出现 risk_fraction 或非 0.01 手直接拒绝启动）。
#
# MaCrossATR（reentry="immediate" 类缺省）：5/15 快慢线保证两周内有足量
# 开平仓与 SL/TP 出场，覆盖 §7 的"SL/TP 出场后不触发暂停、按重入规则
# 继续""每笔成交可归因""换日禁入拒单"等场景。lookback_bars=30 ≥ slow
# 网格上界（MaCrossATR.LOOKBACK_BARS）。
# 启动：scripts/demo_run.ps1 -Mode Demo（启动前跑 DEMO 保险丝与网关预检，
# 均为只读 dry 检查）。
symbol = "XAUUSD"
timeframe = "M15"
strategy = "mt5quant.backtest.reference:MaCrossATR"
params = { fast = 5, slow = 15, stop_loss_atr = 2.0, take_profit_atr = 3.0 }
magic = 902601
lookback_bars = 30
volume_lots = 0.01
trigger_delay_s = 5
