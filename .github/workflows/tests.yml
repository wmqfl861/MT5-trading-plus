name: tests

# 每次推送到 main 与每个 PR 都在 Windows 上跑全量 pytest。
# 测试不连 MT5 终端（MetaTrader5 为延迟导入，纯逻辑用 FakeMT5），只需装依赖。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q -p no:cacheprovider 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          # 把汇总行（如 "388 passed in 20.1s"）写成注解：在 PR/提交的检查结果里直接可见
          $summary = Get-Content pytest-output.txt | Where-Object { $_ -match '\d+ (passed|failed|error)' } | Select-Object -Last 1
          Write-Output "::notice title=pytest::$summary"
          # 失败时把每个 FAILED/ERROR 测试写成 error 注解（免鉴权可经 API 读到名单）
          if ($code -ne 0) {
            Get-Content pytest-output.txt |
              Where-Object { $_ -match '^(FAILED|ERROR)' } |
              Select-Object -First 30 |
              ForEach-Object { Write-Output "::error title=failing-test::$($_.Trim())" }
          }
          exit $code
