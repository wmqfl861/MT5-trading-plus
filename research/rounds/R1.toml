# approved_by 留空 = 草案；装载器（rounds.load_round）拒绝空 approved_by，
# 因此"批准前不开轮"由机器保证。用户批准时填入批准人并提交，才可
# bt round open R1（开启另有前置：本文件已提交且工作区干净、候选全部
# screened_pass——台账 candidate_checks 最新 decision=pass、lockbox 申报
# ≤ D16 剩余预算）。
#
# 现状如实记录（2026-10-29 重提时点，台账 candidate_checks 最新结论）：
# - C001 pass（2026-10-28T21:03:54Z，T94 重跑终值）：swap_dependent=true
#   ——swap_free 口径（成本倍数 29.68、检验力 53.5%）通过而 charged 口径
#   （1.47、16.1%）不通过；翻案首发于 ccaad37（2026-10-28T16:57Z，倍数
#   29.63）：依赖 2026-10-29 用户对四品种 swap_free 的账户确认
#   （config/account-profile.toml，三观测窗证据）。
# - C002 pass（2026-10-28T21:03:46Z 终检，b3b65d0/T94）：EURUSD 研究段
#   18.72 年（histdata 2007-01 起 ∪ MT5，扣月级闸门丢弃月份）、隐含夏普
