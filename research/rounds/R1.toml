# 两候选均 screened_pass（台账口径，T62；运行约束以台账为准，候选 TOML
# 的 status 字段是登记材料）。
#
# 两点如实披露（详见 docs/research/candidates-R1-2026-10-29.md，交批准点裁决）：
# 1. C001 研究段非盲检（R13 K3）：observed_in_sample="T66 §3.2"，两次观察
#    已记台账 run 447/448——只能靠锁箱与前向样本确认（本轮 advance_rule
#    即含 G5）。"月末类候选不在 USTEC、BTCUSD 上登记（K3）"（计划 T68b）
#    约束**新登记**，不溯及 2026-10-28 已登记的 C001。
# 2. R13 §4.3 曾按目标市场发表后证据（Han, Han & Tian 2025：美股 TOM
#    2001 年后消失）判 C001 预期≈0、退出 R1，并明言"是否 swap-free 都
#    改变不了这一点"；2026-10-29 swap_free 确认后按登记折算值（−58% 口径
#    0.24%/事件）机械重检翻 pass（swap_dependent 如实标注）。两种口径在
#    C001.toml 的 expected_effect 并存，重提以台账最新结论（pass）列入；
#    若批准点维持 R13 §4.3 判定，则 candidates 改为 ["C002"]、trial_budget
#    相应改为 2 后再批——本草案不预改。
id = "R1"
opened = "2026-10-29"
candidates = ["C002"]        # 台账最新预筛均 pass（附录 D ≤3）；
                                     # 开启前置"全部 screened_pass"已满足
trial_budget = 2                     # 2 × 候选数（R13 §4.3 修订要求/计划 T68b：
                                     # 每个候选只跑登记的一个主规格，窗口变体
                                     # 只作诊断（关卡套件内部计算，不单独作研
                                     # 究运行），留一次代码修复后的重跑）
lockbox_uses_max = 1                 # D16 机器强制：每研究轮次最多 1 次 G5（总预算 3 次，H/P 线共用）
dsr_trial_scope = "rounds_lineage"   # T85/D34 冻结 + T96 对齐：N = ledger.primary_test_n
                                     # 的门槛部分 = 轮次内全项目累计去重研究试验
                                     # + 候选延续谱系的轮次外去重试验；轮次制
                                     # 之前的其余历史只报告不进门槛
advance_rule = "推进（本轮算过）= 候选的主检验与全部适用否决项通过（两候选均事件模式，按冻结 config/gates.toml 的 [v3.event]/D35 口径）：主检验 = 随机化参照检验，单侧 p ≤ α/N（α=0.05 复用 [v3] 同一值；N 按 dsr_trial_scope=rounds_lineage 口径——轮次内全项目累计去重研究试验 + 候选延续谱系轮次外去重试验，不吃 n_min，随机化检验 N=1 也精确；随机化次数 ≥ max(1999, ⌈20N/α⌉)，入口预检低于下限拒绝运行）；G0 通过；否决仅一项适用 = 成本 ×1.5 后每事件净均值仍 > 0（'延迟一根'与'多头相对买入持有超额'两项对按时钟定义的事件窗不适用、不运行——[v3.event] 两 veto=false）；诊断四项（年块自助对 0、事件窗前后各移一根 bar、分段均值、已知缺口注记）只报告不否决。任一候选判定'过'后，本轮不再为其挑选参数或开新变体（过了不再同轮挑选）；判定依据全部为本文件与冻结 gates.toml 的预写规则，不按结果临时调整。"
close_rule = "结束条件（先到即止）：(a) 试验预算 4 次去重研究试验用尽；或 (b) 全部候选均有结论——通过者最多 1 次 G5（lockbox_uses_max=1，D16）后关闭，未通过者登记结论关闭。关闭后 bt round close R1 生成轮次报告（含全部运行与按 advance_rule 的判定），本轮不能再运行。"
approved_by = "user"                     # 草案留空：交 H 线审核会话复核、用户批准后由批准方填写（批准点；执行会话不得填写）

