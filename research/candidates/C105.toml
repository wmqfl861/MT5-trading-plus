# T97 新增可选键（M2；沿 C102 的 approach/bracket/Δp 逐字不动，D51）
max_gap_days = 30                  # 触发抑制的洞宽阈值（先决 4：>30 天的洞按局面窗口包含式判定）
cost_scenario_mult = [1.0, 1.5]    # 情景点差双档：1x 基准 + 保守绑定档（H 线 robustness.py EARLY_YEARS_SPREAD_FACTOR 同源先例）
