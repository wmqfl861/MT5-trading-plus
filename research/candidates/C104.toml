# C104：S1 整数关口（XAUUSD+EURUSD；T97 数据解锁批——前驱 C101 的新版本）
# 登记时间：2026-10-29（T97/M2：登记与文档波次）
# 前驱 id：C101（S1 整数关口，XAUUSD）——文献材料与登记预期沿前驱，本文件只登记增量
# 增量 = HistData 解锁 + EURUSD（D53 新版本登记）：XAUUSD ext 2009-05..2021-12
