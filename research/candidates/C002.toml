# C002 月末对冲调仓（USTEC 当月涨跌 → EURUSD，月末定盘前）——蓝图 v4 §6.6
# 首批候选之二（T68，2026-10-28 登记）。只写材料、不跑数据（附录 C）。
# 信号品种 USTEC（只出信号不下单），交易品种 EURUSD（symbols 为成交品种）。
id = "C002"
title = "月末对冲调仓（USTEC 当月涨跌 → EURUSD，伦敦定盘前）"
mechanism_class = "cross_asset"
status = "waiting_data"             # 2026-10-28 bt candidate check 实测（ECB 14bp 口径修订后）：waiting_data（检验力 45% < 50%，EURUSD 日内 4.44 年且外部日内源未批准——MDS 2.14 封顶）；事前成本倍数 4.89 过线
symbols = ["EURUSD"]
holding = "H1"
mechanism = "外国股票组合管理人按月末市值调汇率对冲敞口：当月美股上涨 → 对冲市值上升 → 月末最后一个定盘前须卖出 USD 买回本币（或反向），集中在伦敦定盘前一小时成交（Melvin & Prins 2015 的对冲通道）。送钱方：在定盘前一小时被动承接对冲流的对手方。信号 = USTEC 上月倒数第二日至本月倒数第二日的累计涨跌；交易 = 月末最后交易日伦敦定盘前 1 小时的 EURUSD 方向仓（涨→多 EURUSD/USD 贬值方向）。"

[literature]
original = ["Melvin & Prins (2015), Equity hedging and exchange rates at the London 4 p.m. fix, Journal of Financial Markets 22: 50-72"]
replications = [
  "Ito & Yamada (2017/2018), Did the Reform Fix the London Fix Problem?, NBER WP 23327；Journal of International Money and Finance 80: 75-95——2015-02-15 定盘改革（WMR 4pm 计算窗口 1 分钟→5 分钟，约 15:57:30-16:02:30）后：定盘窗口成交量尖峰消失，但'此前文献报告的价格动态异象仍然存在'，且银行被动化执行带来新的可预测成分",
  "Krohn, Mueller & Whelan (2024), Foreign Exchange Fixings and Returns Around the Clock, Journal of Finance 79(1): 541-578——1999-01 至 2019-12（21 年）逐年存在定盘前持续升值、定盘后反转的日内模式（样本覆盖 2015 改革前后）；EUR 定盘周边策略免成本夏普（工作稿表 IX：1.37 / 1.23 / 2.01——第十二轮独立成果审核自工作稿核对的口径）",
]
rebuttals = [
  "Krohn, Mueller & Whelan (2024) 同文：定盘周边日内波动'扣足全额买卖价差后大多消失'（hard to exploit after costs）——对可交易性（而非统计存在性）的直接反驳，与本项目事前成本口径正面冲突",
]
search_log = "Web 检索（聚合引擎），2026-10-28：（1）Melvin Prins London 4pm fix equity hedging replication/after 2015 reform——命中 Ito & Yamada（NBER 23327，JIMF 2018）、Krohn-Mueller-Whelan（JF 2024，IDEAS/学者主页核对卷期 79(1) 541-578；样本期 1999-01 至 2019-12）、Evans-Marsh-Payne-Saar (2018, JFQA) 'Fixing the Fix?'（定盘窗口参与者价格冲击 1-1.2bp，秒级口径，作量级参照不计入复现）；（2）WMR 2015 改革细节：检索 WM Reuters 4pm fix February 2015 five-minute window——Norges Bank（Marsh/Panagiotou/Saarinen 系列）与 Ito-Yamada 核对为 2015-02-15 起 1 分钟→5 分钟（15:57:30-16:02:30），未发现定盘时刻移至 15:30 的证据（与早先印象相反，如实记录）；（3）原文幅度：初检时 ECB 会议稿 PDF 与 ScienceDirect 付费页均不可机读（WebFetch 不支持 PDF / 403），未取得 bps 幅度——第十二轮独立成果审核（2026-10-28）自同一 ECB 会议稿第 14 页核得回归系数 0.0142（10% 月涨幅 → 14bp 贬值，月末最后定盘前一小时窗），本登记已采纳并据此重折算；初检所引'EUR 定盘策略夏普 0.65'出处为第三方摘要页（paritytrading.app），未能在原文/工作稿可及文本复核，已删除，改引工作稿表 IX 免成本夏普（审核核对口径）；（4）数据可得性（仓库内，2026-10-28 查阅 docs/research/ext-data-2026-10-27.md 与 T81）：EURUSD 日内仅 MT5 段 4.44 年；HistData 未批准（未找到使用条款原文）、Dukascopy 原则可用但当前不可达——日内长历史待定。未从本项目任何数据取值（铁律 17；E|r_月| 与 σ 为品种性质事前量）。"
published_effect = "2004-2013 八大流动货币（USD/EUR/JPY/GBP/CAD/AUD/SEK/CHF）：上月倒数第二日至本月倒数第二日的股市收益可预测本月最后一日伦敦定盘前的货币收益——股市上涨 → 该国货币在月末最后定盘前可预测贬值（对冲再平衡方向）。量化口径（ECB 第三届 FX Workshop 会议稿 2013-11 第 14 页，出版版同结论）：回归系数 0.0142，即月内股市每上涨 10% → 该国货币在**月末最后定盘前一小时**贬值 14bp（与本候选事件窗同构）。"
expected_effect = "折算（全部文献折算/事前计算，不取自本项目数据，铁律 17）：原文锚 14bp/10% 月涨幅 = 1.4bp/1%；信号月涨幅的期望绝对值 E|r_月| 取品种性质（fred 纳指 100 日线 1986-2025 共 477 个月实测 5.25%，σ_月 6.78%——品种波动性质，非候选信号样本内）→ 毛收益 ≈ 1.4bp × 5.25 ≈ 7.3bp/事件；发表后衰减 ×(1-0.58)（McLean & Pontiff 2016）→ ≈ 3.1bp/事件 = 0.00031。独立审核折算（σ_月≈6.1%、E|r|≈4.9%）得毛 ≈7bp、衰减后 ≈2.9bp——与本项目折算同一量级，差异为样本窗取法，如实并列。下沿对照：Krohn 等 (2024) 工作稿表 IX 的 EUR 定盘周边策略免成本夏普 1.37/1.23/2.01（策略级、扣费前）。取舍：采用**原文锚 × 发表后 -58%**（锚来自原策略本身的回归系数，且 -58% 口径覆盖 2015 改革后的衰减）。年化夏普按隐含口径事前折算：（0.00031 − 事前来回成本）÷ 品种 H1 无条件波动 σ × √12 ≈ 0.83（σ 为品种性质，2026-10-28 预检工具实测约 0.10%）。"

[declared]
events_per_year = 12                # 每月最后一个交易日各一个定盘前事件
gross_return_per_event = 0.00031    # 3.1bp：Melvin-Prins 14bp/10% × E|r_月|5.25% × 0.42（见 expected_effect）
window_bars = 1                     # T84/K4：事件窗 = 定盘前 1 小时 = 1 根 H1（伦敦 15:00→16:00）；σ 按 entry_hour_ny=10 的同一时段起点取（定盘前一小时时段 σ，非全天平均）——等 T87 数据延长后按此口径重检
entry_hour_ny = 10                  # 伦敦 15:00（定盘前 1 小时窗起点）= 纽约 10:00（DST 同步）
exit_hour_ny = 11                   # 伦敦 16:00 定盘 = 纽约 11:00；夏令时由 zoneinfo 处理（T66 london_fix_events）
overnight_nights = 0.0              # 事件窗为日内 1 小时，不过夜
expected_sharpe = 0.83              # （0.00031 − 事前成本）÷σ_H1×√12 的文献折算值（见 expected_effect；σ 为全天平均口径的登记折算，T84 重检起按定盘前一小时时段 σ 取，以 precheck JSON 为准）
