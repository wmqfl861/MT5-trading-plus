search_log = "Web 检索（聚合引擎）+ 原文下载核对，2026-10-29：（1）'time series momentum gold futures post-publication evidence after Huang 2020 trend following still profitable'——命中 mdickens.me 2026-02 博客 'Contra Time-series momentum: Is it there?'（博客级，未计作证据）、Han-Yang-Zhou 商品期货趋势（仅搜索摘要命中、原文未核对，不计入）、Hurst-Ooi-Pedersen 2017（计入复现）；（2）MOP 2012 原文：fairmodel.econ.yale.edu/ec439/jpde.pdf（出版版 23 页）与 elmwealth.com 50 页工作稿下载后 pypdf 抽取——出版版逐合约夏普为图（Fig.2 柱状图，金在列但柱高不可机读，如实注明），工作稿表 2 Panel B 商品类 k=12/h=1 alpha t=3.26、表 3 分散组合月 alpha 1.26%、附录 A 确认 Gold=COMEX；（3）CME 'Demystifying Time-Series Momentum Strategies'（逐资产表）——cmegroup.com 下载两次超时，未取得；（4）检索 'Moskowitz Ooi Pedersen Table per asset gold Sharpe' 未命中可机读逐资产数表；（5）未找到：黄金单资产 TSMOM 的发表后/样本外复现（最接近为 HOP 2017 类级证据）——故按缺复现的 −58% 默认衰减（McLean & Pontiff 2016）。paritytrading.app 转述页曾用于定位文献但不作证据来源（与 C002 先例一致）。未从本项目任何数据取预期效应值（铁律 17；σ 为品种性质由预检工具实测）。"
published_effect = "MOP 2012（评估段 1985-2009）：58 个期货合约的 12 个月 TSMOM（1 个月持仓、月度再平衡、按波动定仓）——全部 58 个合约毛夏普为正、52 个 5% 显著（出版版正文与 Fig.2；Gold 为 24 个商品期货之一，逐合约柱高为图形式不可机读）；分散组合月 alpha 1.26%（对 MSCI World+FF 因子）、组合年化波动 9.3-12%；商品类 k=12/h=1 alpha t=3.26（工作稿表 2 Panel B，25 年样本）；对 always-long 的 alpha 90% 为正但仅 26% 显著。52 周后转为反转（回归滞后项为负）。"
expected_effect = "折算链（全部文献折算，不取自本项目数据，铁律 17）：单资产毛夏普锚取 0.4——依据：MOP Fig.2 商品组逐合约柱高目测区间约 0.2-0.8（金的具体柱高不可机读，取中低段为保守锚），与类级口径自洽（商品类 alpha t=3.26、25 年 → 类级毛夏普≈0.65，等于逐合约均值≈0.4-0.5 配平均两两相关≈0.09 的分散化）；无黄金单资产发表后复现 → ×(1-0.58)（McLean & Pontiff 2016 默认衰减）→ 预期年化夏普≈0.17。每事件毛收益 = 0.4 × σ_1月 ÷ √12 × 0.42 ≈ 0.0022（σ_1月 为品种性质：登记时外部常识口径≈4.5%/月，2026-10-29 预检工具 window_bars=500 实测 **3.98%**——隐含夏普 0.185，检验力取 min(声明 0.17, 隐含)，以 precheck JSON 为准）。研究段 XAUUSD/H1≈15.6 年下该夏普的单次检验力实测 **16%** → 待数据；§6.6 的历史均值基准与多品种合并检验力为开卡前置（见 mechanism）。Huang (2020) 若在研究段成立（TSMOM≈历史均值），本候选应按其结论放弃——预筛数字不因该风险调整（折算已含 −58%）。"

