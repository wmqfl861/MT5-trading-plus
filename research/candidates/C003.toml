title = "XAUUSD 12 个月时间序列动量（月度再平衡，H1）"
mechanism_class = "trend"
status = "waiting_data"            # 2026-10-29 预筛（bt candidate check，台账留痕）：waiting_data——事前成本倍数 30.61（swap_free 口径 >3 过；charged 口径 0.60 不过，隔夜费敏感，按 account-profile 以 swap_free 决定）；研究段 XAUUSD/H1 合并 **15.63 年**（histdata 2009-05 起 ∪ mt5 2014 起，区间并集），σ(500×H1)=3.98% 下隐含夏普 0.185、声明 0.17（取小），单次检验力 **16% < 50%**（§6.2 条件 4）→ 待数据（铁律 18：延长研究段（T67）后重检）；机制空缺 trend（条件 5 过）。§6.6 趋势类开卡前置不变：历史均值基准对照 + always-long 对照 + 多品种合并检验力（见 mechanism）
symbols = ["XAUUSD"]
holding = "H1"
observed_in_sample = "C901/H002 唐奇安通道突破（XAUUSD+BTCUSD H1 标定样品，台账 97 次运行，2026-10-27 只读查证）——同为趋势机制、同品种，其样本内结果在本项目已被查看（T61/D30 改标定样品，结果只作测量证据）；本候选（12 个月符号 TSMOM）与唐奇安突破是不同信号，但盲检已失效的影响按 K3 如实登记，确认只能靠锁箱与前向样本"
mechanism = "时间序列动量（MOP 2012）：过去 12 个月收益为正则做多、为负则做空，持有 1 个月、每月再平衡。送钱方（MOP 的解释）：反应不足与新信息缓慢扩散下逆势提供流动性的对冲者——黄金端即矿产商/央行的对冲盘与散户摸顶抄底的慢资金；42% 折算后的残余优势为其让渡。谱系必带设计（蓝图 §6.6）：(a) Huang et al. (2020) 历史均值基准对照（逐资产 TSMOM 与历史均值策略难以区分是其核心反驳）；(b) always-long（符号恒 +1）对照（MOP 出版版：对 always-long 的 alpha 90% 为正但仅 26% 显著——趋势收益与无条件漂移大量重叠）；(c) 若同轮并入 BTCUSD 同机制候选（C004），按 §6.4 做多品种合并的事件/交易级检验与检验力测算。"

