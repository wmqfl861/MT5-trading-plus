search_log = "Web 检索（聚合引擎）+ 原文下载核对，2026-10-29：（1）'short-term reversal cryptocurrency bitcoin weekly reversal liquidity provision Nagel replication'——命中：Bianchi et al. (Riksbank WP 413/JBF) 用 Nagel (2012) 短期反转收益代理加密流动性提供（横截面、多币）；SSRN 6703498（2026）加密 8-10 周反转集中在中市值币（横截面）；arXiv 2608.21888v1（2026-08，全文抓取核对）：183 个 Binance 对 15 分钟尺度反转存在（BTC AUC 0.533）但毛利峰值 1.3bp/笔 vs 5bp 来回成本不可交易、小时尺度减半、4 小时消失——**日内反转在本项目成本条件下不可行，BTCUSD 单品种周度反转无证据**；（2）'Liu Tsyvinski cryptocurrency momentum 1-4 week Sharpe'——NBER w24877 与 w25882 PDF 下载 pypdf 抽取核对（表 14/15/16/17 与表 4）；（3）'Borri Liu Tsyvinski Wu 2025 momentum after 2020'——定位 arXiv 2510.14435 并下载核对表 2 Panel B（2020 后 CMOM 5-1 = 2.1%/周，t=3.70）；转述页 paritytrading.app 只用于定位、不作证据来源（C002 先例）；（4）未找到：BTCUSD 单资产周度 TSMOM 的 2020 年后直接复现（最接近为 Borri 2025 横截面与 LTW 2022 的 Bitcoin-做空腿稳健性）；未核对：Fieberg et al. 2024 原文（转引）；Auckland ACFR 'Time-series and cross-sectional momentum under realistic assumptions'（搜索命中、未逐字核对，不计入）——现实成本敏感性按情景倍数由预筛成本模型覆盖。未从本项目任何数据取预期效应值（铁律 17；σ 为品种性质由预检工具实测）。"
published_effect = "Liu & Tsyvinski (2021, RFS)：比特币周收益显著正预测未来 1-4 周收益（回归系数 0.19/0.22/0.21/0.09，t=3.73/4.52/4.26/1.72；样本 2011-01–2018-05，周 σ 16.64%）——1 个标准差的上周收益 → 下周 +3.16%；无前视五分位（表 17）：最高组次周 +7.88%/周（t=2.70）、SR 0.37，最高−最低点差 4.53%/周；2013 起子样本点差 4.35%/周。LTW (2022, JF)：横截面 1-4 周动量零投资组合显著（1 周 +2.7%/周 t=1.99）。Borri et al. (2025)：两周动量横截面 2020 年后 +2.1%/周（t=3.70）、最高组较市场均值组超额约 +1.1%/周。"
expected_effect = "折算链（全部文献折算，不取自本项目数据，铁律 17）：锚 1（发表后存活）：Borri 2025 的 2020 年后动量组较市场均值超额 ≈ +1.1%/周（横截面口径）；锚 2（原始回归折算当代波动）：β=0.19 × E|r_周|（当代 BTC 周 σ≈5-6% → E|r|≈4.4%）≈ 0.84%/周（泡沫期样本、未折算）。单资产 BTC 无发表后直接复现（LTW 2022 的 Bitcoin 替代做空腿结果为不显著——最直接的负面证据）→ 取锚 1 × (1-0.58)（M&P 默认衰减，缺单资产复现）= 0.46%/周，再按 LTW 负面证据向下取整 **0.4%/周 = 0.004/笔（毛）**。年化夏普按隐含口径事前折算：(0.004 − 事前来回成本) ÷ σ_周 × √52 ≈ 0.29（σ_周 为品种性质：登记时外部常识口径≈7.5%，2026-10-29 预检工具 window_bars=7 实测 **7.52%**——隐含夏普 0.363 > 声明 0.29，检验力取小，以 precheck JSON 为准）。研究段 BTCUSD/D1≈10.9 年下该夏普的单次检验力实测 **24%** → 待数据；LTW 负面证据若在研究段成立（单口径不显著/为零），本候选应放弃——预筛数字不因该风险再调整（折算已含 −58% 与向下取整）。"

