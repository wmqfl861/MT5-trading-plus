observed_in_sample = "C901/H002 唐奇安通道突破（XAUUSD+BTCUSD H1 标定样品，台账 97 次运行，2026-10-27 只读查证）——同为趋势机制且含 BTCUSD 腿，其样本内结果在本项目已被查看（T61/D30 改标定样品，结果只作测量证据）；本候选（周度符号 TSMOM）与其不同信号，但按 K3 如实登记盲检失效，确认只能靠锁箱与前向样本"
mechanism = "加密市场周度时间序列动量（Liu & Tsyvinski 2021）：过去 1 周收益为正则做多、为负则做空（或平），持有 1 周、每周再平衡。送钱方：加密市场信息扩散慢（注意力驱动）下对新信息反应不足的投资者与逆势做市的流动性提供者。谱系必带设计（与 C003 同受 §6.6 约束）：(a) Huang et al. (2020) 历史均值基准对照；(b) always-long 对照（RFS 原文最低分位组也为正——动量利得多来自做多腿的时代漂移，LTW 2022 指出以 Bitcoin 替换做空腿后 1/2/4 周动量不再显著）；(c) 与 C003 同机制多品种合并检验力（§6.4）。研究段在 cdd/Bitstamp D1（D36 白名单）上评估，成本按情景倍数。"

