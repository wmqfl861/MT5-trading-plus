mechanism = """央行会议日程的信息溢价/风险补偿：1994-09 起 FOMC 决议于会议
最后一日约 14:00-14:15 ET 即时公布，公告前 24 小时存在系统性向上漂移
（Lucca & Moench 2015：占 1994 以来股票超额收益约 80%）。机制解释：部分
投资者为'央行信息提前反映'付出溢价/承担公告前隔夜宏观风险获得补偿
（Ai & Bansal 2018 风险再定价通道）。送钱方：在公告前 24 小时内卖出/做空
并被漂移轧空的对手方，及不要求公告前风险补偿的流动性提供者。事件触发
= FOMC 预排常规会议日历（federalreserve.gov 官方日程工件，8 次/年，非行情
数据）；信号只用已收盘 bar 与事前已公布的日历，不依赖公告内容/惊喜方向。"""

