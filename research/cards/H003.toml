# H003：B2 NY 开盘区间突破（USTEC M5，P5 基线）。
# 现象依据：Gao/Han/Li/Zhou (2018) 开盘半小时信息含量 + 开盘区间突破的
# 期货交易传统（ORB）。先卡后测：第一次回测前已提交到 git。
id = "H003"
version = 1
symbols = ["USTEC"]
timeframe = "M5"
session = "America/New_York 09:30-10:00 构筑开盘区间，10:00 后跟入，exit_hour（14/15 点 NY）整点收盘离场（避开冬季 21:00 UTC 换日窗）"
phenomenon = "开盘区间（NY 09:30-10:00）的高低点被收盘突破后，当日倾向于沿突破方向延续；开盘首半小时是日内信息含量与成交量最大的时段（Gao et al. 2018）"
mechanism = "隔夜信息在开盘竞价与首半小时集中定价，方向确立后机构执行算法（VWAP/TWAP 拆单）与迟到市价单在区间边界触发止损/追价连锁，订单流不平衡延续到午盘——送钱方是开盘追涨杀跌的散户市价单与被扫损的区间内头寸"
should_fail_when = "窄区间+消息面反复的日子（假突破多、双向扫损）；低波动周（区间宽度过滤会自动停手，其余日子靠 ATR 止损控制）"
falsified_if = "样本内净利为负或 profit factor <1.2；成本 ×1.5 后期望转负（M5 换手对成本敏感，这是最可能死掉的关卡）；随机入场基准 95 分位不被超过"
graveyard_checked = []

[rules]
entry = "NY 10:00 后首根收盘 > 开盘区间高点 → +1；< 区间低点 → -1；收盘回到区间内粘性维持，破对侧收盘反手"
exit = "bar 收盘本地时刻达 exit_hour_ny → 信号归零（引擎恰在整点开盘价平仓）；引擎层 1.0×ATR14 止损（止损后信号仍在则按缺省 immediate 重入）"
stop = "1.0×ATR14（Wilder，信号 bar 值）；区间宽度 < min_range_atr×ATR14（简单 TR 均值）的窄区间日整日不交易"

[params]
exit_hour_ny = [14, 15]
min_range_atr = [0.0, 0.5, 1.0]

[expected]
trades_per_year = "约 200-250 笔/年（每日至多一次主交易，约 250 个交易日；反手会略增）"
win_rate = "35-50%"
payoff_ratio = "1.2-2.0"
