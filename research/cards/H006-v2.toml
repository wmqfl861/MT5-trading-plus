# H006-v2：B5 纳指日内动量——尾盘出场 16:00→15:45 NY 提前 15 分钟
#（谱系 H006 第二版，parent = H006 v1）。
# 动机（gates-calibration-2026-10-25 §3/§5）：v1 尾盘信号窗 [15:30,16:00) NY 的持仓边界
# 在冬季（EST）逼近 21:00 UTC——USTEC 每日维护/换日小时无 tick，成本模型按缺统计小时
# 禁入 missNY[17]，v1 关卡基准运行因"USTEC 小时 21 无点差统计"失败如实入台账——
# "设计缺陷而非证伪，v2 提前 15 分钟出场再测"。v2 把信号窗上界 16:00→15:45（同 v1 的
# 左闭右开口径，窗口整体提前 15 分钟），出场成交落在 15:45 整点开盘价（冬季 20:45 UTC，
# 距 21:00 维护窗 15 分钟）。v3 口径下 M5 全窗版已能跑完但净亏（PF 0.71，台账 run#440）
# ——v2 同时检验：负结果是出场撞维护窗的执行问题，还是现象本身在该品种/成本下不成立。
# 绑定策略：IntradayMomentumNyEarlyExit（本卡随带的库策略子类——尾盘出场时刻在
# v1 是模块常量而非参数，须子类承载；方向判定、参数网格、止损全部继承不变）。
# 先卡后测：本卡在第一次回测前已提交到 git，提交时间即预测登记时间。
id = "H006-v2"
family = "H006"
version = 2
parent = "H006"
strategy = "mt5quant.strategies.library.b5_intraday_momentum_early_exit:IntradayMomentumNyEarlyExit"
symbols = ["USTEC"]
timeframe = "M5"
session = "America/New_York 09:30-10:00 定方向，尾盘信号窗 [15:30,15:45)（v1 的 [15:30,16:00) 窗口边界在冬季逼近 21:00 UTC 维护窗，整体提前 15 分钟）"
selection_rule = "max_net_profit"
phenomenon = "承 v1：市场日内动量——标普/ETF/期指开盘头半小时收益对尾盘收益有显著正预测（Gao et al. 2018）。v2 附加假设：尾盘延续的可交易部分在 15:30-15:45 已兑现；最后 15 分钟贴近维护窗/收盘结算，执行质量差、不值得持有"
mechanism = "承 v1：隔夜与开盘信息在首半小时由知情与机构资金定价；收盘前的 MOC/再平衡执行盘（养老金、指数基金）按当日已确立方向增减敞口，迟到的日内交易者跟随——尾盘延续开盘方向，送钱方是承担隔夜风险意愿不足、尾盘才确认方向的迟到资金"
should_fail_when = "承 v1：盘中反转日（开盘方向被午盘消息否定，尾盘反向）；低波动周期（首半小时方向噪声大）——min_ret_atr 门槛即为此设。v2 特有：若动量集中在最后 15 分钟（提前出场丢掉全部 edge），15 分钟窗应系统性弱于 v1 的 30 分钟窗"
falsified_if = "样本内净利为负或 profit factor <1.2；成本 ×1.5 后期望转负（每日 1 笔 M5 交易对成本极敏感）；首半小时方向对 15:30-15:45 收益的样本内相关符号为负（现象本身不成立）；或提前出场后仍复现 v3 的 PF≈0.7（负结果与出场时点无关——放弃谱系）"
graveyard_checked = ["docs/research/gates-calibration-2026-10-25.md（H006 出场撞 USTEC 维护窗、失败运行入台账的记录与 v2 建议）", "docs/research/gates-calibration-v3-2026-10-26.md（M5 全窗 v3 复跑 PF 0.71 的证伪方向记录）"]

[rules]
entry = "承 v1：开盘头半小时（NY 09:30-10:00）收益 r=末根收盘−首根开盘；r>+min_ret_atr×ATR14 → 方向 +1，r<−门槛 → −1，否则 0（ATR 为简单 TR 均值，取头半小时末根 bar 值，不足则当日不交易）；信号在收盘本地时刻 ∈ [15:30,15:45) 的 bar 上取当日方向，引擎 15:30 整点开盘价入场"
exit = "v2 变化：尾盘信号窗从 [15:30,16:00) 整体提前到 [15:30,15:45)（左闭右开口径承 v1，收盘落在窗内的 15:25/15:30/15:35 三根 M5 bar 上信号=方向）——其余 bar 信号为 0，引擎 15:45 整点开盘价离场，持仓恰为收盘前 15 分钟；冬季出场成交 20:45 UTC，距 21:00 维护窗 15 分钟，不再触碰缺统计小时"
stop = "承 v1：引擎层 2.0×ATR14（Wilder，信号 bar 值）止损兜底（尾盘闪跌离场）；止损后 reentry=immediate 缺省语义（持仓窗只剩数根 bar，重入空间有限）"

[params]
min_ret_atr = [0.0, 0.5, 1.0, 1.5]

[expected]
trades_per_year = "约 240-250 笔/年（每日恰一笔，15 分钟持仓不改变日频；min_ret_atr 大时略少）"
win_rate = "50-58%（承 v1，Gao et al. 2018 报告的方向预测胜率量级）"
payoff_ratio = "0.9-1.3（承 v1；持仓减半后单笔盈亏幅度收窄，比率量级不应恶化）"
